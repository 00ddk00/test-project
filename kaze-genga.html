<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaze Genga</title>
<style>
  :root { --paper: #f3f1ec; --ink: #1c1b19; color-scheme: light; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  main { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
<!-- p5.js (UMD build, pinned) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<main id="stage" aria-label="A 10-second looping anime line-art animation of a Japanese woman: a close-up of her eyes, a turn to three-quarter profile in the wind, and a slow return to the close-up."></main>
<script>
/* =====================================================================
   KAZE GENGA — 10-second loopable anime line art (genga / douga style)
   ---------------------------------------------------------------------
   Everything is drawn with ink lines on paper. There are no visible
   color fills: the only fills use the paper color to hide lines that
   sit behind something else (hair in front of the face, and so on).

   Timeline (seconds, loops at 10):
     0–3   The Gaze      close-up of the eyes, drifting bangs, a blink
     3–7   The Turn      camera pulls back, head turns to 3/4 profile,
                         wind lifts the hair and the loose collar
     7–10  The Fading    motion slows, lines break apart and re-form
                         while everything eases back to the close-up

   Loop guarantees:
     • Time is millis() mod 10000, so the clock itself repeats.
     • Every pose curve is a pair of smoothsteps that returns to its
       starting value before t = 10.
     • Every sin/cos runs a whole number of cycles per 10 s.
     • Perlin noise is sampled on a circle in noise space, so it also
       returns to the same value at t = 10.

   Controls: Space or click = pause / play, H = show / hide the timecode.
   ===================================================================== */

const LOOP = 10;                       // seconds
const TAU = Math.PI * 2;
const VW = 1600, VH = 900;             // virtual frame the camera is framed in
const PAPER = [243, 241, 236];
const INK = [28, 27, 25];

let T = 0;                             // current time inside the loop (s)
let P = {};                            // pose parameters for this frame
let unitPx = 1;                        // screen pixels per head unit
let lineBoost = 1;                     // lines get a touch heavier in close-up
let grain;                             // paper texture layer
let paused = false, pauseAt = 0, clockOffset = 0, showHud = true;
let segId = 0;                         // running id for the dissolve effect
let BACK = [], FRONT = [], LOOSE = []; // hair strand definitions

/* ---------- small math helpers ---------- */
const clamp01 = x => Math.min(1, Math.max(0, x));
const ss = (a, b, x) => { x = clamp01((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const bump = (t, c, w) => { const x = (t - c) / w; return Math.abs(x) >= 1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * x); };
const mix = (a, b, u) => a + (b - a) * u;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// Loopable Perlin noise: walk a circle in noise space once per loop.
// seed separates strands; s moves along a strand. Returns roughly -0.5..0.5.
function ln(seed, s, r = 0.7) {
  const a = TAU * T / LOOP;
  return noise(seed * 3.17 + s * 1.15 + r * Math.cos(a), seed * 1.31 + r * Math.sin(a), s * 0.6 + seed * 0.07) - 0.5;
}

/* =====================================================================
   1. TIMELINE — every pose value is a pure function of T
   ===================================================================== */
function computePose(t) {
  const turnU = ss(3.0, 6.2, t) - ss(7.5, 9.8, t);       // 0 = front, 1 = 3/4
  const zoomU = ss(2.7, 6.3, t) - ss(7.3, 9.9, t);       // 0 = close-up, 1 = wide
  return {
    turnU,
    zoomU,
    yaw: 0.06 + 0.64 * turnU,                              // head rotation (rad)
    roll: -0.03 + 0.09 * (ss(3.6, 6.8, t) - ss(7.6, 9.8, t)), // head tilt (rad)
    wind: 0.3 + 0.7 * (ss(3.0, 4.8, t) - ss(6.4, 8.8, t)),    // breeze strength
    // natural blinks, the last one slow and lingering
    blink: Math.max(bump(t, 1.45, 0.13), bump(t, 4.9, 0.12), bump(t, 8.4, 0.34)),
    smile: 0.6 * (ss(6.2, 7.6, t) - ss(8.8, 9.9, t)),
    // lines break into fragments and re-form during the return
    dissolve: Math.pow(Math.sin(Math.PI * clamp01((t - 7.8) / 2.0)), 1.6) * 0.38,
    breathe: Math.sin(TAU * t / LOOP),                      // one slow cycle per loop
  };
}

/* =====================================================================
   2. HEAD MODEL — a simple 3D profile turned by yaw
   Head units: origin at the head center, y points down, crown ≈ -1.3,
   chin = 1.0. Each height y has a horizontal cross-section ellipse:
     half-width a, half-depth b, forward offset c (the jaw sits forward).
   ===================================================================== */
const FT = [ // y,     a,    b,    c
  [-1.32, 0.18, 0.22, 0.00],
  [-1.20, 0.58, 0.64, 0.00],
  [-0.95, 0.80, 0.88, 0.00],
  [-0.60, 0.85, 0.92, 0.00],
  [-0.20, 0.84, 0.90, 0.02],
  [ 0.10, 0.82, 0.86, 0.05],
  [ 0.35, 0.76, 0.78, 0.10],
  [ 0.55, 0.64, 0.66, 0.18],
  [ 0.75, 0.44, 0.48, 0.27],
  [ 0.90, 0.24, 0.30, 0.36],
  [ 1.00, 0.07, 0.13, 0.42],
];
function prof(y) {
  if (y <= FT[0][0]) return { a: FT[0][1], b: FT[0][2], c: FT[0][3] };
  for (let i = 0; i < FT.length - 1; i++) {
    const p = FT[i], q = FT[i + 1];
    if (y <= q[0]) { const u = (y - p[0]) / (q[0] - p[0]); return { a: mix(p[1], q[1], u), b: mix(p[2], q[2], u), c: mix(p[3], q[3], u) }; }
  }
  const L = FT[FT.length - 1]; return { a: L[1], b: L[2], c: L[3] };
}
let cy = 1, sy = 0; // cos / sin of the current yaw

// Point on the front of the face at (X, Y), lifted off the skin by `lift`.
// Returns [screenX, screenY, facing] where facing > 0 means it faces us.
function surf(X, Y, lift = 0) {
  const p = prof(Y), q = Math.max(-1, Math.min(1, X / p.a)), r = Math.sqrt(1 - q * q);
  const z = p.c + (p.b + lift) * r;
  return [X * cy + z * sy, Y, -q * sy + r * cy];
}
// Left (side = -1) or right (side = +1) outline of the head at height Y.
function silh(Y, side, grow = 0) {
  const p = prof(Y), a = p.a + grow, b = p.b + grow;
  return p.c * sy + side * Math.sqrt(a * a * cy * cy + b * b * sy * sy);
}
const proj = (X, Y, Z) => [X * cy + Z * sy, Y];

/* =====================================================================
   3. DRAWING PRIMITIVES — tapered ink lines, with the dissolve filter
   ===================================================================== */
function ink(alpha = 1) { stroke(INK[0], INK[1], INK[2], 235 * alpha * (1 - 0.25 * P.dissolve)); noFill(); }
function W(px) { strokeWeight(Math.max(0.35, px) * lineBoost / unitPx); }
// During the dissolve, a growing share of segments is left out, so lines
// break into fragments and then knit back together.
function keep() { segId++; return !(P.dissolve > 0 && hash(segId * 0.731) < P.dissolve); }

// Catmull-Rom strand through pts using p5 curve(), tapering w0 -> w1.
function strandCR(pts, w0, w1) {
  const n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[i], c = pts[i + 1], d = pts[Math.min(n - 1, i + 2)];
    if (!keep()) continue;
    W(mix(w0, w1, i / Math.max(1, n - 2)));
    curve(a[0], a[1], b[0], b[1], c[0], c[1], d[0], d[1]);
  }
}
// Cubic Bezier drawn as short pieces so the line can swell and taper
// (the "iri-nuki" of hand-inked anime lines). ta / tb = taper lengths.
function tBez(p0, p1, p2, p3, w, ta = 0.2, tb = 0.2, N = 18) {
  let px = p0[0], py = p0[1];
  for (let i = 1; i <= N; i++) {
    const s = i / N;
    const x = bezierPoint(p0[0], p1[0], p2[0], p3[0], s), y = bezierPoint(p0[1], p1[1], p2[1], p3[1], s);
    const m = (i - 0.5) / N, f = Math.min(1, m / ta, (1 - m) / tb);
    if (keep()) { W(w * (0.2 + 0.8 * clamp01(f))); line(px, py, x, y); }
    px = x; py = y;
  }
}
// Paper-colored shape that hides whatever was drawn behind it.
function occlude(pts) {
  noStroke(); fill(PAPER[0], PAPER[1], PAPER[2]);
  beginShape(); for (const p of pts) vertex(p[0], p[1]); endShape(CLOSE);
  noFill();
}

/* =====================================================================
   4. HAIR — strands defined once, then posed every frame
   ===================================================================== */
function buildHair() {
  randomSeed(7);
  // long back hair, rooted along both sides of the skull
  for (let i = 0; i < 46; i++) {
    BACK.push({ side: i % 2 ? 1 : -1, y0: -1.05 + random(1.05), spread: random(0.1, 0.45), len: random(0.78, 1.0), seed: random(100), w: random(0.7, 1.3) });
  }
  // long front hair falling over her left shoulder (viewer's right)
  for (let i = 0; i < 16; i++) {
    FRONT.push({ y0: -0.35 + random(0.45), off: random(-0.08, 0.1), len: random(0.85, 1.0), seed: 200 + random(100), w: random(0.8, 1.4) });
  }
  // a few fine strands that drift across her face
  LOOSE.push({ a: [0.10, -0.92], b: [-0.18, 0.08], c: [-0.30, 0.52], seed: 401 });
  LOOSE.push({ a: [0.22, -0.90], b: [0.42, 0.02], c: [0.58, 0.62], seed: 402 });
  }

// Wind displacement for a point s (0 root .. 1 tip) on a strand.
// Breeze from the right: hair streams left and lifts a little.
function windAt(seed, s, amp = 1) {
  const n1 = ln(seed, s * 1.4), n2 = ln(seed + 9.1, s * 1.1);
  const wave = Math.sin(TAU * (2 * T / LOOP) - s * 4.2 + seed) * 0.07 * s; // 2 cycles per loop
  return [
    (-P.wind * Math.pow(s, 1.45) * (0.55 + 1.1 * n1) + wave * (0.45 + P.wind)) * amp,
    (-P.wind * s * s * 0.28 * (0.5 + n2) + 0.03 * Math.sin(TAU * T / 5 + seed + s * 3) * s) * amp,
  ];
}

function backHairPts(h) {
  const x0 = silh(h.y0, h.side, 0.04), pts = [];
  const bottom = 3.5 * h.len;
  for (let i = 0; i <= 9; i++) {
    const s = i / 9;
    const [dx, dy] = windAt(h.seed, s, 1.25);
    pts.push([x0 + h.side * h.spread * Math.sin(s * Math.PI * 0.5) * 1.5 + dx, mix(h.y0, bottom, s) + dy]);
  }
  return pts;
}
function frontHairPts(h) {
  const x0 = silh(h.y0, 1, 0.03) + h.off, pts = [];
  const bottom = 3.4 * h.len;
  for (let i = 0; i <= 10; i++) {
    const s = i / 10;
    const [dx, dy] = windAt(h.seed, s, 0.55);
    pts.push([x0 + 0.28 * Math.sin(Math.PI * Math.min(1, s * 1.2)) - 0.18 * s + dx, mix(h.y0, bottom, s) + dy]);
  }
  return pts;
}

/* =====================================================================
   5. BODY — shoulders and a loose kimono collar
   ===================================================================== */
function bodyX(X, Z) { const by = 0.25 * P.yaw; return X * Math.cos(by) + Z * Math.sin(by); }
// fabric flutter grows away from the neck and with the wind
function flutter(seed, s, amp) { return P.wind * amp * Math.sin(Math.PI * s) * (0.4 + 1.6 * ln(seed, s * 2)) + 0.012 * Math.sin(TAU * T / 5 + s * 5 + seed); }

function drawBody() {
  const L = [[-0.34, 1.32], [-0.5, 1.6], [-0.9, 1.78], [-1.35, 1.92], [-1.7, 2.25], [-1.85, 3.0], [-1.9, 3.9]];
  const lift = s => flutter(31, s, 0.08);
  const left = L.map(([x, y], i) => [bodyX(x, 0) - lift(i / 6) * 0.5, y - lift(i / 6) * 0.6]);
  const right = L.map(([x, y], i) => [bodyX(-x, 0) + lift(i / 6) * 0.3, y - lift(i / 6) * 0.4]);
  occlude([...left, [left[6][0], 6], [right[6][0], 6], ...right.slice().reverse()]);

  ink(1);
  strandCR(left, 1.6, 1.1);
  strandCR(right, 1.6, 1.1);

  // back of the collar, standing away from the neck (the neck hides its middle)
  tBez([bodyX(-0.46, -0.2), 1.46], [bodyX(-0.3, -0.3), 1.22], [bodyX(0.3, -0.3), 1.22], [bodyX(0.46, -0.2), 1.46], 1.3);

  // the top panel crosses from her left shoulder (viewer's right) to the hip
  const A = [[0.42, 1.42], [0.40, 1.92], [0.08, 2.62], [-0.34, 3.22], [-0.62, 3.95]];
  const B = [[0.58, 1.48], [0.56, 1.98], [0.24, 2.7], [-0.18, 3.32], [-0.46, 4.0]];
  const C = [[-0.42, 1.42], [-0.40, 1.92], [-0.14, 2.5], [0.02, 2.7]];
  const D = [[-0.58, 1.48], [-0.56, 1.96], [-0.3, 2.56], [-0.12, 2.8]];
  const fl = (arr, seed, amp) => arr.map(([x, y], i) => { const s = i / (arr.length - 1); return [bodyX(x, 0.3) + flutter(seed, s, amp), y - flutter(seed + 3, s, amp) * 0.5]; });
  const a = fl(A, 11, 0.16), b = fl(B, 11, 0.19), c = fl(C, 17, 0.1), d = fl(D, 17, 0.12);
  strandCR(c, 1.3, 1.0); strandCR(d, 1.1, 0.8);
  occlude([...a, ...b.slice().reverse()]);           // top collar band covers the lower one
  ink(1);
  strandCR(a, 1.5, 1.1); strandCR(b, 1.3, 0.9);

  // drapery folds on the shoulders and chest (line density = shading)
  ink(0.75);
  const folds = [[-0.85, 1.84, -0.92, 2.7, -0.82, 3.6], [-1.3, 1.95, -1.42, 2.8, -1.36, 3.8], [0.9, 1.84, 0.95, 2.6, 0.88, 3.5], [1.3, 1.95, 1.45, 2.9, 1.42, 3.9], [0.66, 2.2, 0.6, 2.9, 0.4, 3.7]];
  folds.forEach((f, i) => {
    const w = flutter(50 + i, 0.6, 0.1);
    tBez([bodyX(f[0], 0), f[1]], [bodyX(f[2], 0) + w, f[3]], [bodyX(f[2], 0) + w * 1.4, f[3] + 0.3], [bodyX(f[4], 0) + w * 0.6, f[5]], 1.0, 0.35, 0.4);
  });
  // shadow hatching where the collars cross
  ink(0.5);
  for (let i = 0; i < 7; i++) { const x = bodyX(-0.12 + i * 0.05, 0.3), y = 2.72 + i * 0.03; if (keep()) { W(0.8); line(x, y, x - 0.08, y + 0.14); } }
}

/* =====================================================================
   6. NECK — the long line from ear to collarbone carries the turn
   ===================================================================== */
function drawNeck() {
  const ny = 0.55 * P.yaw, cx = -0.12 * Math.sin(ny);
  const lx = cx - 0.33, rx = cx + 0.33;
  const yL = 0.62 - 0.12 * P.turnU, yR = 0.8 + 0.05 * P.turnU;
  occlude([[lx - 0.02, 0.5], [rx + 0.02, 0.5], [rx + 0.06, 1.62], [bodyX(0.4, 0.3), 1.95], [bodyX(0.06, 0.3), 2.62], [bodyX(-0.12, 0.3), 2.5], [bodyX(-0.4, 0.3), 1.95], [lx - 0.06, 1.62]]);
  ink(1);
  tBez([lx + 0.02, yL], [lx - 0.02, 1.0], [lx - 0.02, 1.35], [lx - 0.1, 1.6], 1.4, 0.3, 0.3);
  tBez([rx - 0.02, yR], [rx + 0.01, 1.05], [rx + 0.01, 1.35], [rx + 0.1, 1.6], 1.3, 0.3, 0.3);
  // the sternocleidomastoid line appears as she turns
  ink(0.55 * ss(0.2, 0.55, P.yaw));
  tBez([lx + 0.06, 0.7], [lx + 0.12, 1.0], [cx - 0.05, 1.4], [bodyX(-0.03, 0.3), 1.88], 0.9, 0.4, 0.4);
  // collarbones and the notch between them
  ink(0.6);
  tBez([bodyX(-0.06, 0.3), 1.98], [bodyX(-0.18, 0.3), 1.9], [bodyX(-0.3, 0.3), 1.9], [bodyX(-0.4, 0.3), 1.93], 0.9, 0.3, 0.6);
  tBez([bodyX(0.06, 0.3), 1.98], [bodyX(0.18, 0.3), 1.9], [bodyX(0.3, 0.3), 1.9], [bodyX(0.4, 0.3), 1.93], 0.9, 0.3, 0.6);
  // soft shadow under the jaw
  ink(0.4);
  for (let i = 0; i < 9; i++) { const x = mix(lx + 0.06, rx - 0.04, i / 8), y = 0.86 + 0.04 * Math.sin(i); if (keep()) { W(0.7); line(x, y, x - 0.07, y + 0.14); } }
}

/* =====================================================================
   7. FACE — outline, ear, eyes, brows, nose, lips
   ===================================================================== */
function drawHeadBase() {
  // hair volume behind and above the face
  const crown = [];
  for (let y = 0.15; y >= -1.32; y -= 0.06) crown.push([silh(y, -1, 0.1), y - (y < -1.2 ? 0.06 : 0)]);
  for (let y = -1.32; y <= 0.15; y += 0.06) crown.push([silh(y, 1, 0.1), y - (y < -1.2 ? 0.06 : 0)]);
  occlude(crown);
  ink(1);
  strandCR(crown.filter((_, i) => i % 2 === 0), 1.2, 1.6);

  // skin
  const face = [];
  for (let y = -1.0; y <= 1.0; y += 0.05) face.push([silh(y, -1), y]);
  for (let y = 1.0; y >= -1.0; y -= 0.05) face.push([silh(y, 1), y]);
  occlude(face);

  // jaw lines meeting at the chin
  ink(1);
  const jl = [], jr = [];
  for (let y = -0.1; y <= 1.001; y += 0.1) { jl.push([silh(y, -1), y]); jr.push([silh(y, 1), y]); }
  strandCR(jl, 0.9, 1.7);
  strandCR(jr, 0.9, 1.7);

  // crown strands radiating from the parting, with the "angel ring" zigzag
  ink(0.7);
  const part = surf(0.14, -1.18, 0.12);
  for (let i = 0; i < 11; i++) {
    const X = mix(-0.8, 0.8, i / 10), end = surf(X, -0.62, 0.1), midp = surf(mix(0.14, X, 0.55), -0.98, 0.14);
    strandCR([[part[0], part[1]], [midp[0], midp[1]], [end[0], end[1]]], 0.5, 1.0);
  }
  ink(0.85);
  const zz = [];
  for (let i = 0; i <= 14; i++) { const X = mix(-0.72, 0.72, i / 14), p = surf(X, -0.9 + (i % 2 ? 0.05 : -0.02), 0.14); zz.push([p[0], p[1]]); }
  for (let i = 0; i < zz.length - 1; i++) if (keep()) { W(0.9); line(zz[i][0], zz[i][1], zz[i + 1][0], zz[i + 1][1]); }

  // ear on the far side, revealed by the turn
  const earA = ss(0.15, 0.45, P.yaw);
  ink(earA);
  const ear = [[0, 0.02], [-0.1, 0.0], [-0.16, 0.12], [-0.14, 0.3], [-0.06, 0.44], [0.0, 0.46]].map(([u, v]) => { const p = prof(0.02 + v); return proj(-p.a * 0.98, 0.02 + v, p.c + u); });
  strandCR(ear, 1.2, 0.8);
  const inner = [[-0.05, 0.12], [-0.09, 0.2], [-0.06, 0.32]].map(([u, v]) => { const p = prof(v); return proj(-p.a * 0.96, v, p.c + u); });
  strandCR(inner, 0.7, 0.5);
}

// One anime eye. sgn = +1 her left (viewer's right), -1 her right.
function drawEye(sgn) {
  const [ex, , nz] = surf(sgn * 0.37, 0.12);
  const vis = ss(0.02, 0.3, nz);
  const k = Math.max(0.28, Math.min(1, nz));           // foreshortening on the far side
  const o = 1 - P.blink;                                // 1 open, 0 shut
  const yawN = (P.yaw - 0.06) / 0.64;
  // the gaze stays on the viewer while the head turns away
  const gu = -sgn * (0.07 * yawN) + 0.008 * Math.sin(TAU * T / 5);

  push();
  translate(ex, 0.12);
  scale(sgn * k, 1);
  const IC = [-0.17, 0.02], OC = [0.21, 0.0];
  const c1 = [mix(-0.06, -0.10, o), mix(0.08, -0.15, o)];
  const c2 = [mix(0.10, 0.10, o), mix(0.09, -0.17, o)];

  // iris, clipped to the eye opening
  if (o > 0.08) {
    const ctx = drawingContext;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(IC[0], IC[1]);
    ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], OC[0], OC[1]);
    ctx.bezierCurveTo(0.12, 0.16, -0.05, 0.17, IC[0], IC[1]);
    ctx.clip();
    ink(vis);
    const icx = gu, icy = 0.045;
    W(1.3); if (keep()) ellipse(icx, icy, 0.23, 0.29);
    const hl = [[icx + 0.045, -0.02, 0.036], [icx - 0.05, 0.095, 0.017]];
    const inHL = (x, y) => hl.some(([hx, hy, r]) => (x - hx) ** 2 + (y - hy) ** 2 < r * r);
    // radial strokes: denser lines read as a darker iris
    for (let i = 0; i < 40; i++) {
      const a = (i / 40) * TAU, r0 = 0.058, r1 = 0.108;
      const x0 = icx + Math.cos(a) * r0, y0 = icy + Math.sin(a) * r0 * 1.25;
      const x1 = icx + Math.cos(a) * r1, y1 = icy + Math.sin(a) * r1 * 1.25;
      if (inHL((x0 + x1) / 2, (y0 + y1) / 2)) { keep(); continue; }
      if (keep()) { W(0.6 + 0.4 * (Math.sin(a) < 0)); line(x0, y0, x1, y1); }
    }
    // the shadow of the upper lid: tight horizontal hatching
    for (let v = -0.1; v < -0.02; v += 0.011) {
      const hw = 0.112 * Math.sqrt(Math.max(0, 1 - ((v - icy) / 0.145) ** 2));
      if (keep() && !inHL(icx, v)) { W(0.7); line(icx - hw, v, icx + hw, v); }
    }
    // pupil as a tight stack of lines
    for (let v = -0.012; v <= 0.11; v += 0.012) {
      const hw = 0.044 * Math.sqrt(Math.max(0, 1 - ((v - 0.05) / 0.064) ** 2));
      if (hw > 0.004 && keep() && !inHL(icx, v)) { W(0.8); line(icx - hw, v, icx + hw, v); }
    }
    W(0.7);
    for (const [hx, hy, r] of hl) if (keep()) ellipse(hx, hy, r * 2, r * 2);
    if (keep()) arc(icx, icy + 0.02, 0.15, 0.16, 0.3, Math.PI - 0.3);
    ctx.restore();
  }

  ink(vis);
  // upper lid: heavy toward the outer corner, drawn twice for weight
  tBez(IC, c1, c2, OC, 3.2, 0.5, 0.08, 22);
  tBez([IC[0] + 0.08, IC[1] - 0.05 * o], [c1[0] + 0.02, c1[1] - 0.012], [c2[0], c2[1] - 0.014], [OC[0] + 0.01, OC[1] - 0.012], 2.0, 0.6, 0.1, 16);
  // outer wing and lashes (pointing down when the eye is shut)
  tBez(OC, [0.235, 0.01], [0.255, 0.03], [0.27, 0.06], 1.4, 0.1, 0.9, 6);
  for (let i = 0; i < 4; i++) {
    const s = 0.62 + i * 0.11;
    const x = bezierPoint(IC[0], c1[0], c2[0], OC[0], s), y = bezierPoint(IC[1], c1[1], c2[1], OC[1], s);
    const dir = mix(0.85, -0.9, o) + i * 0.12;
    const len = 0.05 + 0.012 * i;
    tBez([x, y], [x + 0.02, y - dir * len * 0.4], [x + len * 0.6, y - dir * len * 0.8], [x + len, y - dir * len * 0.7], 1.1, 0.05, 0.9, 5);
  }
  // lower lid: just a short stroke at the outer third
  ink(vis * mix(0.35, 1, o));
  tBez([0.0, 0.158], [0.08, 0.162], [0.16, 0.12], [0.2, 0.04], 1.1, 0.6, 0.3, 10);
  // double-eyelid crease
  ink(vis * 0.7);
  tBez([-0.1, -0.2 + 0.05 * (1 - o)], [0.0, -0.26 + 0.07 * (1 - o)], [0.12, -0.25 + 0.07 * (1 - o)], [0.2, -0.17 + 0.05 * (1 - o)], 0.9, 0.4, 0.4, 10);
  pop();
}

function drawFace() {
  // brows, thin and long
  for (const sgn of [-1, 1]) {
    const pts = [];
    for (let i = 0; i <= 5; i++) { const s = i / 5; const p = surf(sgn * mix(0.15, 0.6, s), -0.22 - 0.07 * Math.sin(Math.PI * s) + 0.02 * s, 0.01); pts.push(p); }
    ink(ss(0.05, 0.3, pts[2][2]));
    strandCR(pts.map(p => [p[0], p[1]]), 1.2, 0.5);
  }
  drawEye(-1);
  drawEye(1);

  // nose: a small tick in front view, a bridge line in 3/4
  const zN = prof(0.44).c + prof(0.44).b;
  const tip = proj(0.02, 0.44, zN + 0.12);
  ink(0.9);
  tBez(proj(0.04, 0.39, zN + 0.07), proj(0.04, 0.41, zN + 0.1), [tip[0], tip[1] - 0.01], tip, 1.1, 0.4, 0.2, 8);
  tBez(tip, [tip[0] - 0.01, tip[1] + 0.01], proj(0.0, 0.46, zN + 0.07), proj(-0.02, 0.465, zN + 0.05), 0.9, 0.2, 0.6, 6);
  ink(0.55 * ss(0.25, 0.55, P.yaw));
  tBez(proj(0.0, 0.2, zN + 0.02), proj(0.01, 0.28, zN + 0.06), proj(0.02, 0.36, zN + 0.1), [tip[0], tip[1] - 0.02], 0.8, 0.5, 0.5, 8);

  // lips: a quiet line that lifts into a faint smile
  const mouth = [];
  for (let i = 0; i <= 6; i++) {
    const u = i / 6 * 2 - 1, X = u * 0.12;
    const p = surf(X, 0.665 + 0.01 * u * u - P.smile * 0.03 * u * u, 0.01);
    mouth.push([p[0], p[1]]);
  }
  ink(1);
  for (let i = 0; i < mouth.length - 1; i++) {
    const a = mouth[Math.max(0, i - 1)], b = mouth[i], c = mouth[i + 1], d = mouth[Math.min(6, i + 2)];
    if (keep()) { W(0.6 + 1.2 * Math.sin(Math.PI * (i + 0.5) / 6)); curve(a[0], a[1], b[0], b[1], c[0], c[1], d[0], d[1]); }
  }
  ink(0.6);
  const l1 = surf(-0.045, 0.74, 0.01), l2 = surf(0.0, 0.748, 0.01), l3 = surf(0.045, 0.74, 0.01);
  strandCR([[l1[0], l1[1]], [l2[0], l2[1]], [l3[0], l3[1]]], 0.8, 0.8);

  // blush: a few short diagonal strokes on each cheek
  for (const sgn of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      const p = surf(sgn * (0.3 + i * 0.045), 0.33, 0.01);
      ink(0.4 * ss(0.1, 0.4, p[2]));
      if (keep()) { W(0.7); line(p[0], p[1], p[0] - 0.03, p[1] + 0.06); }
    }
  }
}

/* =====================================================================
   8. HAIR IN FRONT — bangs, side locks, loose strands
   ===================================================================== */
// One pointed clump: two bowed Bezier edges meeting at the tip.
function clump(r1, r2, tip, bow, seed) {
  const c1 = [r1[0] - bow * 0.3, r1[1] + 0.25], c2 = [tip[0] - bow * 0.5, tip[1] - 0.22];
  const c3 = [tip[0] + bow * 0.2, tip[1] - 0.25], c4 = [r2[0] + bow * 0.1, r2[1] + 0.22];
  noStroke(); fill(PAPER[0], PAPER[1], PAPER[2]);
  beginShape(); vertex(r1[0], r1[1]); bezierVertex(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]); bezierVertex(c3[0], c3[1], c4[0], c4[1], r2[0], r2[1]); endShape(CLOSE);
  ink(1);
  tBez(r1, c1, c2, tip, 1.5, 0.15, 0.55, 14);
  tBez(r2, c4, c3, tip, 1.5, 0.15, 0.55, 14);
  ink(0.6);
  const m = [(r1[0] + r2[0]) / 2, (r1[1] + r2[1]) / 2];
  tBez(m, [m[0] - bow * 0.1, m[1] + 0.2], [tip[0] - bow * 0.2, tip[1] - 0.18], [mix(m[0], tip[0], 0.85), mix(m[1], tip[1], 0.85)], 0.8, 0.3, 0.6, 10);
}

function drawBangs() {
  const X = [-0.66, -0.44, -0.22, 0.0, 0.2, 0.42, 0.64];
  const TY = [-0.12, 0.0, -0.06, 0.07, -0.09, 0.02, -0.1];
  X.forEach((x, k) => {
    const d = ln(500 + k, 0.8, 0.5) * (0.06 + 0.08 * P.wind) - 0.05 * P.wind;
    const r1 = surf(x - 0.13, -0.9, 0.1), r2 = surf(x + 0.13, -0.9, 0.1);
    const tp = surf(x * 1.04 + 0.05 + d, TY[k] + ln(520 + k, 0.5, 0.4) * 0.03, 0.06);
    clump([r1[0], r1[1]], [r2[0], r2[1]], [tp[0], tp[1]], 0.08 + 0.04 * Math.sign(x), k);
  });
}

function drawSideLocks() {
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const y0 = -0.55 + i * 0.2;
      const xr = silh(y0, side, 0.06);
      const r1 = [xr - side * (0.06 + 0.1 * i) - side * 0.1, y0 - 0.04], r2 = [xr + side * 0.02, y0 + 0.04];
      const [dx, dy] = windAt(600 + side * 10 + i, 1, side > 0 ? 0.45 : 0.9);
      const tip = [silh(1.0 + 0.2 * i, side, 0) + side * (0.25 + 0.08 * i) + dx, 1.1 + 0.2 * i + dy];
      clump(r1, r2, tip, side * 0.12, 600 + i);
    }
  }
}

function drawLoose() {
  ink(0.55);
  for (const s of LOOSE) {
    const pts = [];
    for (let i = 0; i <= 6; i++) {
      const u = i / 6;
      const x = bezierPoint(s.a[0], s.b[0], s.b[0], s.c[0], u), y = bezierPoint(s.a[1], s.b[1], s.b[1], s.c[1], u);
      const [dx, dy] = windAt(s.seed, u, 0.5);
      const p = surf(x + dx * 0.6, y + dy * 0.5, 0.12);
      pts.push([p[0], p[1]]);
    }
    strandCR(pts, 0.9, 0.3);
  }
}

/* =====================================================================
   9. CAMERA — one continuous move, close-up -> wide -> close-up
   ===================================================================== */
function cameraFor() {
  const eyes = surf(0, 0.12);
  const viewH = Math.exp(mix(Math.log(1.28), Math.log(4.85), P.zoomU)) * (1 + 0.015 * P.breathe);
  const cx = mix(eyes[0], 0.55, P.zoomU) + 0.02 * Math.sin(TAU * T / LOOP);
  const cyy = mix(0.16, 1.06, P.zoomU);
  return { viewH, cx, cy: cyy };
}

/* =====================================================================
   p5 lifecycle
   ===================================================================== */
function setup() {
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  const c = createCanvas(window.innerWidth, window.innerHeight);
  c.parent('stage');
  strokeCap(ROUND); strokeJoin(ROUND);
  curveTightness(0);              // plain Catmull-Rom
  noiseDetail(3, 0.45);           // layered Perlin octaves
  buildHair();
  makeGrain();
  c.elt.addEventListener('click', togglePause);
}

function windowResized() { resizeCanvas(window.innerWidth, window.innerHeight); makeGrain(); }

function makeGrain() {
  grain = createGraphics(width, height);
  grain.pixelDensity(1);
  grain.noStroke();
  randomSeed(3);
  for (let i = 0; i < (width * height) / 90; i++) {
    grain.fill(INK[0], INK[1], INK[2], random(4, 14));
    grain.rect(random(width), random(height), random() < 0.85 ? 1 : 2, 1);
  }
}

function togglePause() {
  if (paused) { clockOffset += millis() - pauseAt; paused = false; }
  else { pauseAt = millis(); paused = true; }
}
function keyPressed() {
  if (key === ' ') { togglePause(); return false; }
  if (key === 'h' || key === 'H') showHud = !showHud;
}

function draw() {
  // The clock: wall time mod 10 s, so frame drops never stretch the loop.
  const now = paused ? pauseAt : millis();
  T = (((now - clockOffset) % (LOOP * 1000)) + LOOP * 1000) % (LOOP * 1000) / 1000;
  P = computePose(T);
  cy = Math.cos(P.yaw); sy = Math.sin(P.yaw);
  segId = 0;

  background(PAPER[0], PAPER[1], PAPER[2]);

  // fit the 16:9 virtual frame inside the window, then frame the shot
  const fit = Math.min(width / VW, height / VH);
  const cam = cameraFor();
  unitPx = fit * VH / cam.viewH;
  lineBoost = Math.pow(4.85 / cam.viewH, 0.32);

  push();
  translate(width / 2, height / 2);
  scale(unitPx);
  translate(-cam.cx, -cam.cy);

  // back to front
  ink(0.9);
  for (const h of BACK) strandCR(backHairPts(h), 1.1 * h.w, 0.35);
  drawBody();
  drawNeck();

  push();
  translate(0, 1.2); rotate(P.roll); translate(0, -1.2);   // head tilts on the neck
  drawHeadBase();
  drawFace();
  drawBangs();
  drawLoose();
  drawSideLocks();
  pop();

  // long hair over her shoulder: a paper halo first, then the ink line
  for (const h of FRONT) {
    const pts = frontHairPts(h);
    stroke(PAPER[0], PAPER[1], PAPER[2]); const saved = P.dissolve; P.dissolve = 0;
    strandCR(pts, 5.0, 3.0); P.dissolve = saved;
    ink(1); strandCR(pts, 1.2 * h.w, 0.35);
  }
  pop();

  image(grain, 0, 0);
  if (showHud) drawHud();
}

function drawHud() {
  const beat = T < 3 ? 'The Gaze' : T < 7 ? 'The Turn' : 'The Fading';
  noStroke(); fill(INK[0], INK[1], INK[2], 120);
  textFont('monospace'); textSize(12);
  textAlign(LEFT, BOTTOM);
  text(`${T.toFixed(1).padStart(4, '0')}s / 10s   ${beat}${paused ? '   (paused)' : ''}   space: pause · h: hide`, 16, height - 14);
}
</script>
